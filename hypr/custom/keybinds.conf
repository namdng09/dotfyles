# To switch between windows in a floating workspace:
bind = ALT, Tab, cyclenext         # Change focus to another window
unbind = SUPER, B
bind = SUPER, B, exec, kitty -e bluetui 
# bind = ALT, Tab, bringactivetotop  # Bring it to the top

unbind = SUPER, A
bind = SUPER, A, exec, /usr/bin/firefox

# bind = SUPER, Y, exec, kitty --class yazi-fm --title yazi-fm --override background_opacity=0.75 --override dynamic_background_opacity=yes -e yazi
